name: Publish extension image

on:
  workflow_call:
    inputs:
      identifier:
        required: true
        type: string
      name:
        required: true
        type: string
      description:
        required: true
        type: string
      web-port:
        required: true
        type: number

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      WEB_PORT: ${{ inputs.web-port }}
    steps:
      - uses: actions/checkout@v4
      - name: Require a version tag
        shell: bash
        run: |
          [[ "$GITHUB_REF" == refs/tags/* ]]
          [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
      - uses: actions/checkout@v4
        with:
          repository: ixian-ukraine/blueos-extensions
          ref: main
          path: .catalog
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          labels: |
            version=${{ env.TAG }}
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test web service and daemon
        shell: bash
        run: |
          docker run --detach --name extension-smoke --privileged \
            --publish "127.0.0.1:18080:$WEB_PORT" "$IMAGE:$TAG"
          trap 'docker logs extension-smoke; docker rm --force extension-smoke' EXIT
          curl --fail --silent --show-error --retry 30 --retry-all-errors \
            --retry-delay 2 --max-time 5 \
            http://127.0.0.1:18080/register_service | python3 -m json.tool
          curl --fail --silent --show-error http://127.0.0.1:18080/ > /dev/null
          if [[ "$WEB_PORT" == 8908 ]]; then
            docker exec extension-smoke /app/mediamtx --version
            curl --fail --silent --show-error http://127.0.0.1:18080/api/paths | python3 -m json.tool
          elif [[ "$WEB_PORT" == 9132 ]]; then
            docker exec extension-smoke netbird version
            docker exec extension-smoke netbird status --check live
          elif [[ "$WEB_PORT" == 9131 ]]; then
            test "$(docker exec extension-smoke zerotier-one -v)" = "${TAG#v}"
            docker exec extension-smoke zerotier-cli info
            docker exec extension-smoke bash /healthcheck.sh
            curl --fail --silent --show-error \
              http://127.0.0.1:18080/v1.0/command/networks | \
              python3 -c 'import json, sys; networks = json.load(sys.stdin); assert isinstance(json.loads(networks), list)'
            node_id=$(docker exec extension-smoke zerotier-cli -j info | \
              python3 -c 'import json, sys; print(json.load(sys.stdin)["address"])')
            docker restart extension-smoke
            curl --fail --silent --show-error --retry 30 --retry-all-errors \
              --retry-delay 2 --max-time 5 \
              http://127.0.0.1:18080/register_service > /dev/null
            restored_id=$(docker exec extension-smoke zerotier-cli -j info | \
              python3 -c 'import json, sys; print(json.load(sys.stdin)["address"])')
            test "$node_id" = "$restored_id"
          else
            echo "No daemon smoke test is configured for port $WEB_PORT" >&2
            exit 1
          fi
      - name: Push image and generate release metadata
        env:
          EXTENSION_ID: ${{ inputs.identifier }}
          EXTENSION_NAME: ${{ inputs.name }}
          EXTENSION_DESCRIPTION: ${{ inputs.description }}
        run: |
          docker push "$IMAGE:$TAG"
          python3 .catalog/scripts/release_manifest.py \
            --repository "$GITHUB_REPOSITORY" --tag "$TAG" \
            --identifier "$EXTENSION_ID" --name "$EXTENSION_NAME" \
            --description "$EXTENSION_DESCRIPTION" --output blueos-manifest.json
      - name: Publish GitHub release
        shell: bash
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            flags=()
            if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "$TAG" --generate-notes "${flags[@]}"
          fi
          gh release upload "$TAG" blueos-manifest.json \
            --repo "$GITHUB_REPOSITORY" --clobber
